[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychohistory"
version = "0.1.0"
description = "Dreams as a window into collective mood and societal dynamics."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexander V. Lebedev" }]
license = { text = "Proprietary — private research repository" }

dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
    "numpy>=1.22",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "requests>=2.28",
    "tqdm>=4.6",
    "zstandard>=0.18",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
signals = ["pytrends>=4.9", "pandas-datareader>=0.10", "wikipedia-api>=0.6"]
external = ["datasets>=2.14", "huggingface-hub>=0.20", "dreamy"]
scoring = ["transformers>=4.30", "torch>=2.0", "sentencepiece", "accelerate"]
dev = ["ruff", "pytest", "jupyter", "ipykernel"]

# NOTE (scoring env on this machine): run with `python3` (Anaconda has torch+transformers).
# transformers pulls TF+boto3; dreams/score.py forces torch-only (USE_TF=0) and drops the
# broken ~/.local urllib3. If invoking manually, prefix: PYTHONNOUSERSITE=1 USE_TF=0.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
